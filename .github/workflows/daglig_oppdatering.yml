name: Daglig Markedsoppdatering & Deployment

on:
  schedule:
    # Kjører hver ukedag etter forrige handelsdags europeiske sluttkurser er tilgjengelige.
    - cron: '0 6 * * 1-5'
  workflow_dispatch:
    inputs:
      fetch_prices:
        description: 'Kjør også eksisterende fullunivers-beregning (modellfond oppdateres alltid)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Sjekk ut repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Sett opp Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer avhengigheter
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance requests openpyxl

      - name: Kjør oppdateringspipeline
        run: |
          python app/build_model_portfolios.py --refresh-prices
          if [ "${{ github.event.inputs.fetch_prices }}" = "true" ]; then
            python oppdater_data.py --fetch-prices
          else
            python oppdater_data.py
          fi
          python app/test_model_portfolios.py

      - name: Commit og push endringer til GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add app/data.js app/model_portfolios.json app/prices/ egenberegning_test/data/prices/ egenberegning_test/output/
          if git diff --staged --quiet; then
            echo "Ingen nye endringer å publisere."
          else
            git commit -m "Automatisert markedsoppdatering $(date -u +'%Y-%m-%d %H:%M UTC') [skip ci]"
            git push origin main
          fi

      # Cloudflare Pages-prosjektet er av typen Direct Upload og oppdateres IKKE
      # automatisk fra GitHub. Derfor må hver oppdatering også deployes eksplisitt.
      - name: Sikkerhetskontroll før deploy
        run: |
          if [ -f app/.env ] && grep -Eq 'CLOUDFLARE_API_TOKEN|cfut_|CLOUDFLARE_ACCOUNT_ID' app/.env; then
            echo "FEIL: app/.env inneholder hemmeligheter og vil bli publisert. Flytt filen ut av app/."
            exit 1
          fi

      - name: Deploy til Cloudflare Pages
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy app --project-name etf-analytics-pro --branch main

      - name: Varsle hvis Cloudflare-hemmeligheter mangler
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' }}
        run: |
          echo "::warning::CLOUDFLARE_API_TOKEN og/eller CLOUDFLARE_ACCOUNT_ID er ikke satt som GitHub-secrets. Data er oppdatert i repoet, men ikke publisert til Cloudflare Pages."
