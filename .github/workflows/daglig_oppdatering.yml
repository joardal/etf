name: Daglig Markedsoppdatering & Deployment

on:
  schedule:
    # Kjører hver ukedag (mandag-fredag) kl. 02:00 UTC (04:00 norsk tid) etter børsene har stengt
    - cron: '0 2 * * 1-5'
  workflow_dispatch:
    inputs:
      fetch_prices:
        description: 'Hent nye kurser fra Yahoo Finance (inkrementelt)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Sjekk ut repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Sett opp Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Installer avhengigheter
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance requests openpyxl

      - name: Kjør oppdateringspipeline
        run: |
          if [ "${{ github.event.inputs.fetch_prices }}" = "true" ]; then
            python oppdater_data.py --fetch-prices
          else
            python oppdater_data.py
          fi

      - name: Commit og push endringer til GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add app/data.js app/prices/manifest.json egenberegning_test/output/
          if git diff --staged --quiet; then
            echo "Ingen nye endringer å publisere."
          else
            git commit -m "Automatisert markedsoppdatering $(date -u +'%Y-%m-%d %H:%M UTC') [skip ci]"
            git push origin main
          fi
